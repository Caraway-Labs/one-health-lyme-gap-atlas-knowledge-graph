[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "one-health-lyme-gap-atlas-knowledge-graph"
version = "1.0.0"
requires-python = ">=3.11,<3.14"
dependencies = ["pydantic>=2.10,<3"]

[project.optional-dependencies]
dev = ["mypy>=1.14,<2", "pytest>=8.3,<9", "ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/lyme_gap_atlas_kg"]

[tool.hatch.build.targets.wheel.force-include]
"config" = "lyme_gap_atlas_kg/config"
"schemas" = "lyme_gap_atlas_kg/schemas"
"cypher" = "lyme_gap_atlas_kg/cypher"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["lyme_gap_atlas_kg"]
